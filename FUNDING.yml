## Why Support AIRank?

AIRank is 100% open-source and free to use. Your support helps us:

- 🚀 Accelerate development of new AI visibility features
- 🤖 Build autonomous AI agents for brand monitoring
- 📊 Improve multi-model scanning and analytics
- 🌐 Expand language and platform support
- 📚 Create better documentation and tutorials
- 🛡️ Maintain security and stability

